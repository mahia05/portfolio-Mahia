<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/72699a80f3.js" crossorigin="anonymous"></script>
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
</head>

<body>
    <header>
        <a href="#" class="logo">Mahia</a>
        <input type="checkbox" id="menu-toggle">

        <label for="menu-toggle" id="menu-icon">
            <i class="fa-solid fa-bars"></i>
        </label>
        <!-- <nav class="navbar">-->
        <nav>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <div class="bars-animation">
        <div class="bar" style="--i:6;"></div>
        <div class="bar" style="--i:5;"></div>
        <div class="bar" style="--i:4;"></div>
        <div class="bar" style="--i:3;"></div>
        <div class="bar" style="--i:2;"></div>
        <div class="bar" style="--i:1;"></div>
    </div>
    <section class="contact">
        <div class="contact-form">
            <h1>Contact <span>Me</span></h1>
            <form action="">
                <input type="" placeholder="Your Name" required>
                <input type="email" name="email" id="" placeholder="E-mail" required>
                <input type="" placeholder="Write a Subject" required>
                <textarea name="" id="" cols="30" rows="10" placeholder="Your Message" required></textarea>
                <input type="submit" name="" value="Submit" class="btn">
            </form>
        </div>
        <div class="contact-img">
            <img src="images/Contact.png" alt="">
        </div>
    </section>

    <!--footer part-->
    <footer>
        <div class="footer-container">
            <p>&copy; 2026 Mahia Tabassum Chowdhury. All Rights Reserved.</p>
        </div>
    </footer>

</body>

</html>
